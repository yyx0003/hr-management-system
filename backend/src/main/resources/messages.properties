# =====================================================================
# messages.properties
# 人事給与管理システム 共通メッセージファイル
# プログラム内にメッセージを直接書き込まず、本ファイルのキーを参照すること。
# {0}, {1}... はプレースホルダ（該当データを埋め込む）。
#
# キー命名規則: {画面ID}.{項目・機能}.{種別} / system.* はシステム共通 / batch.* はバッチ共通
# =====================================================================

# ---------------------------------------------------------------------
# システム共通（開始・終了・予期せぬエラー）
# ---------------------------------------------------------------------
system.process.start=処理を開始します。
system.process.end=処理が終了しました。
system.error.unexpected=予期せぬシステムエラーが発生しました。

